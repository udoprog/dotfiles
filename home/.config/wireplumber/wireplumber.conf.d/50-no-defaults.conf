# Don't select any default audio devices. Routing is handled externally,
# so WirePlumber shouldn't pick or persist defaults.
#
# policy.default-nodes and its rescan/apply hooks are required by
# policy.standard, so only the hooks that pick a node are disabled. With no
# node picked, the apply hook clears default.audio.{sink,source}.
wireplumber.profiles = {
  main = {
    hooks.default-nodes.find-selected = disabled
    hooks.default-nodes.find-best = disabled
    hooks.default-nodes.state = disabled

    # Don't auto-route streams without a target to the highest-priority device.
    hooks.linking.target.find-best = disabled
  }
}
